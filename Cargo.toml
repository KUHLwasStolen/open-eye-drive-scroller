[package]
name = "open-eye-drive-scroller"
version = "0.1.0"
authors = ["KUHLwasStolen <149091393+KUHLwasStolen@users.noreply.github.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "open-eye-drive-scroller"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
as5600 = "0.8.0"
anyhow = "1.0.98"
embedded-hal = "1.0.0"

[build-dependencies]
embuild = "0.33"
